# pacman.conf used by `cargo am rootfs` (pacstrap -C). Plain Arch repos only,
# so nothing from the host's extra repos (e.g. EndeavourOS) leaks in.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
