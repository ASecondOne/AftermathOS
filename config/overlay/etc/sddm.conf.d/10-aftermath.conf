[General]
DisplayServer=wayland
# Keep warning text sharp; the greeter's Qt scene does not need GPU effects.
GreeterEnvironment=QT_QUICK_BACKEND=software
HaltCommand=/usr/bin/poweroff
RebootCommand=/usr/bin/reboot

[Theme]
Current=breeze

[Users]
MinimumUid=1000
MaximumUid=59999

[X11]
SessionDir=/usr/share/aftermath/xsessions

[Wayland]
CompositorCommand=/usr/lib/aftermath/aftermath-greeter
SessionDir=/usr/share/aftermath/wayland-sessions
SessionCommand=/usr/lib/aftermath/aftermath-desktop-session
