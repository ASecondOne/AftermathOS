# Aftermath system settings. Read by aftermath-engine at boot and by amctl.

[desktop]
enabled = true
# Distribution Plasma packages by default; enable for local Plasma changes.
source_build = false
# Temporary development defaults requested for fresh images: bob/bob, root/bob.
# Applied once to a fresh host root; normal reboots preserve changed passwords.
development_accounts = true

[console]
# Authenticated login on Ctrl+Alt+F2. Development root consoles remain on
# the existing boot consoles; this is still an experimental development image.
# Empty list disables additional login terminals.
login_ttys = ["tty2"]

[locale]
# Console keyboard layout (a kbd keymap name, see /usr/share/kbd/keymaps).
# German without dead keys by default. Change it here or with
# `amctl keymap set <name>` (e.g. "us", "de-latin1", "de_CH-latin1").
keymap = "de-latin1-nodeadkeys"

# X11 / Wayland layout for the (future) desktop. The engine writes
# /etc/X11/xorg.conf.d/00-keyboard.conf from these at every boot.
xkb_layout = "de"
xkb_variant = "nodeadkeys"
xkb_model = "pc105"
xkb_options = ""
