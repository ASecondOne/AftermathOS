[package]
name = "aftermath-engine"
description = "Aftermath engine: services, strata, control socket, boot success (supervised by PID 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["mount", "signal", "process", "fs", "socket", "user"] }
serde_json = "1"
aftermath-ctl = { path = "../aftermath-ctl" }
aftermath-strata = { path = "../aftermath-strata" }
