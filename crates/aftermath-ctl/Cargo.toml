[package]
name = "aftermath-ctl"
description = "amctl (Aftermath control): the front door to the engine, plus the shared control protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "amctl"
path = "src/bin/amctl/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["mount", "signal", "socket", "net", "reboot", "user", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
aftermath-strata = { path = "../aftermath-strata" }
